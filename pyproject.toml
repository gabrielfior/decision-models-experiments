[project]
name = "decider-autoresearch"
version = "0.1.0"
description = "Autoresearch loop for sub-1B Jev-class decision models (frozen torso + small option-scoring head)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
]

[project.optional-dependencies]
# GPU-side deps (torso loading, LoRA, data download) are pinned in [dependency-groups] gpu below
# once the transformers version that loads Qwen3.5 + LFM2.5 + ModernBERT is confirmed.

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.uv]
package = false
